<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Quality Analysis System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #007bff;
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 15px;
        }
        .nav-tabs .nav-link {
            color: #495057;
        }
        .nav-tabs .nav-link.active {
            color: #007bff;
            font-weight: bold;
        }
        .result-card {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .chart-container {
            height: 300px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-5">Water Quality Analysis System</h1>
        
        <ul class="nav nav-tabs mb-4" id="modelTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="prediction-tab" data-bs-toggle="tab" data-bs-target="#prediction" type="button" role="tab">Prediction Model</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="calculation-tab" data-bs-toggle="tab" data-bs-target="#calculation" type="button" role="tab">Calculation Model</button>
            </li>
        </ul>

        <div class="tab-content" id="modelTabsContent">
            <!-- Prediction Model Tab -->
            <div class="tab-pane fade show active" id="prediction" role="tabpanel">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Water Quality Prediction</h5>
                    </div>
                    <div class="card-body">
                        <form id="predictionForm">
                            <div class="mb-3">
                                <label for="predictionDate" class="form-label">Select Date and Time</label>
                                <input type="datetime-local" class="form-control" id="predictionDate" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Predict Water Quality</button>
                        </form>
                        
                        <div class="loading" id="predictionLoading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <div id="predictionResults" style="display: none;">
                            <div id="predictionOutput"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Calculation Model Tab -->
            <div class="tab-pane fade" id="calculation" role="tabpanel">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Water Quality Calculation</h5>
                    </div>
                    <div class="card-body">
                        <form id="calculationForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="salinity" class="form-label">Salinity</label>
                                    <input type="number" class="form-control" id="salinity" step="0.01" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="ph" class="form-label">pH</label>
                                    <input type="number" class="form-control" id="ph" step="0.01" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dissolvedOxygen" class="form-label">Dissolved Oxygen</label>
                                    <input type="number" class="form-control" id="dissolvedOxygen" step="0.01" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="dissolvedMethane" class="form-label">Dissolved Methane</label>
                                    <input type="number" class="form-control" id="dissolvedMethane" step="0.01" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="cdom" class="form-label">CDOM</label>
                                    <input type="number" class="form-control" id="cdom" step="0.01" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="temperature" class="form-label">Temperature</label>
                                    <input type="number" class="form-control" id="temperature" step="0.01" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Calculate Water Quality</button>
                        </form>

                        <div class="loading" id="calculationLoading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>

                        <div id="calculationResults" style="display: none;">
                            <div id="calculationOutput"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Prediction Form Handler
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loading = document.getElementById('predictionLoading');
            const results = document.getElementById('predictionResults');
            
            loading.style.display = 'block';
            results.style.display = 'none';

            try {
                const date = document.getElementById('predictionDate').value;
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ date: date }),
                });

                const data = await response.json();
                if (data.success) {
                    displayPredictionResults(data);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        });

        // Calculation Form Handler
        document.getElementById('calculationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loading = document.getElementById('calculationLoading');
            const results = document.getElementById('calculationResults');
            
            loading.style.display = 'block';
            results.style.display = 'none';

            try {
                const formData = {
                    salinity: document.getElementById('salinity').value,
                    ph: document.getElementById('ph').value,
                    dissolved_oxygen: document.getElementById('dissolvedOxygen').value,
                    dissolved_methane: document.getElementById('dissolvedMethane').value,
                    cdom: document.getElementById('cdom').value,
                    temperature: document.getElementById('temperature').value
                };

                const response = await fetch('/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData),
                });

                const data = await response.json();
                if (data.success) {
                    displayCalculationResults(data.results);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        });

        function displayPredictionResults(results) {
            const output = document.getElementById('predictionOutput');
            const resultsDiv = document.getElementById('predictionResults');
            
            // Helper function to format metrics with standard deviation
            const formatMetric = (value, std) => {
                return `${(value * 100).toFixed(2)}% ± ${(std * 100).toFixed(2)}%`;
            };

            // Create a formatted display of the results
            output.innerHTML = `
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Prediction Results</h5>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <strong>Predicted Condition:</strong>
                            <span class="badge bg-${results.prediction.condition === 'Safe' ? 'success' : 'danger'}">
                                ${results.prediction.condition}
                            </span>
                        </div>
                        <div class="mb-3">
                            <strong>Probabilities:</strong>
                            <div class="mt-2">
                                ${Object.entries(results.prediction.probabilities)
                                    .map(([condition, prob]) => `
                                        <div class="d-flex justify-content-between">
                                            <span>${condition}:</span>
                                            <span>${(prob * 100).toFixed(2)}%</span>
                                        </div>
                                    `).join('')}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Model Performance</h5>
                        <div class="alert alert-info">
                            <small>Metrics are based on 5-fold cross-validation</small>
                        </div>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Metric</th>
                                        <th>Value</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Accuracy</td>
                                        <td>${formatMetric(results.model_metrics.accuracy, results.model_metrics.accuracy_std)}</td>
                                    </tr>
                                    <tr>
                                        <td>F1 Score</td>
                                        <td>${formatMetric(results.model_metrics.f1_score, results.model_metrics.f1_score_std)}</td>
                                    </tr>
                                    <tr>
                                        <td>Precision</td>
                                        <td>${formatMetric(results.model_metrics.precision, results.model_metrics.precision_std)}</td>
                                    </tr>
                                    <tr>
                                        <td>Recall</td>
                                        <td>${formatMetric(results.model_metrics.recall, results.model_metrics.recall_std)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Feature Importance</h5>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Feature</th>
                                        <th>Importance</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${Object.entries(results.feature_importance)
                                        .sort((a, b) => b[1] - a[1])
                                        .map(([feature, importance]) => `
                                            <tr>
                                                <td>${feature}</td>
                                                <td>${(importance * 100).toFixed(2)}%</td>
                                            </tr>
                                        `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            resultsDiv.style.display = 'block';
        }

        function displayCalculationResults(results) {
            const output = document.getElementById('calculationOutput');
            const resultsDiv = document.getElementById('calculationResults');
            
            // Helper function to format parameter values
            const formatParameterValue = (value) => {
                return typeof value === 'number' ? value.toFixed(2) : value;
            };

            // Helper function to create a badge for conditions
            const createConditionBadge = (condition) => {
                const color = condition === 'Safe' ? 'success' : 'danger';
                return `<span class="badge bg-${color}">${condition}</span>`;
            };

            // Create a formatted display of the results
            output.innerHTML = `
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Overall Assessment</h5>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <strong>Overall Condition:</strong>
                            ${createConditionBadge(results.overall_condition)}
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <strong>Overall Score:</strong>
                            <span>${results.overall_score.toFixed(2)}%</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <strong>Prediction Confidence:</strong>
                            <span>${(results.prediction_confidence * 100).toFixed(2)}%</span>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Parameter Analysis</h5>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Parameter</th>
                                        <th>Value</th>
                                        <th>Condition</th>
                                        <th>Thresholds</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${Object.entries(results.parameter_conditions).map(([param, condition]) => `
                                        <tr>
                                            <td><strong>${param.toUpperCase()}</strong></td>
                                            <td>${formatParameterValue(results.parameter_values[param])}</td>
                                            <td>${createConditionBadge(condition)}</td>
                                            <td>
                                                <small>
                                                    Min: ${formatParameterValue(results.thresholds[param].min)}<br>
                                                    Max: ${formatParameterValue(results.thresholds[param].max)}
                                                </small>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Recommendations</h5>
                        <div class="alert ${results.overall_condition === 'Safe' ? 'alert-success' : 'alert-danger'}">
                            ${results.overall_condition === 'Safe' 
                                ? 'The water quality is within acceptable ranges. Continue regular monitoring.' 
                                : 'The water quality requires attention. Review the parameter analysis above for specific issues.'}
                        </div>
                        ${Object.entries(results.parameter_conditions)
                            .filter(([_, condition]) => condition === 'Unsafe')
                            .map(([param, _]) => `
                                <div class="alert alert-warning">
                                    <strong>${param.toUpperCase()}</strong> is outside the safe range 
                                    (${formatParameterValue(results.thresholds[param].min)} - 
                                    ${formatParameterValue(results.thresholds[param].max)}). 
                                    Current value: ${formatParameterValue(results.parameter_values[param])}
                                </div>
                            `).join('')}
                    </div>
                </div>
            `;

            resultsDiv.style.display = 'block';
        }
    </script>
</body>
</html>
